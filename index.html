<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Duel</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060f;
        font-family: monospace;
        color: #e6e9ff;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #ui[hidden] {
        display: none;
      }
      .panel {
        pointer-events: auto;
        background: rgba(10, 12, 30, 0.92);
        border: 2px solid #5b6cff;
        border-radius: 8px;
        padding: 20px 28px;
        min-width: 320px;
      }
      .panel.retry {
        position: fixed;
        bottom: 40px;
        min-width: 0;
        text-align: center;
      }
      .panel h1 {
        margin: 0 0 12px;
      }
      .panel h2 {
        font-size: 16px;
        margin: 16px 0 6px;
      }
      .panel input {
        font: inherit;
        margin-left: 8px;
        padding: 4px;
      }
      #room-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #room-list li {
        padding: 6px 8px;
        border: 1px solid #333a66;
        margin-bottom: 4px;
        cursor: pointer;
      }
      #room-list li.selected {
        border-color: #9dff9d;
        color: #9dff9d;
      }
      #lobby-status {
        font-size: 12px;
        color: #8890b0;
        min-height: 16px;
      }
      #lobby-status.error {
        color: #ff8a8a;
      }
      button {
        font: inherit;
        font-weight: bold;
        padding: 8px 24px;
        background: #5b6cff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:disabled {
        background: #333a66;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
