name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: unit tests (vitest + coverage shared)
        run: npm test
      - name: build
        run: npm run build
      - name: e2e (playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # образ: розмір < 200 МБ, healthcheck, docker stop < 10 с і вихід з кодом 0
  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} -t space-duel:ci .
      - name: size < 200 MB
        run: |
          SIZE=$(docker image inspect space-duel:ci --format '{{.Size}}')
          echo "image size: $((SIZE / 1024 / 1024)) MB"
          test $SIZE -lt $((200 * 1024 * 1024))
      - name: run, health, graceful stop
        run: |
          docker run -d --name game -p 3000:3000 space-duel:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/ready
          curl -fs http://127.0.0.1:3000/metrics
          START=$(date +%s%N)
          docker stop -t 10 game
          echo "docker stop: $(( ($(date +%s%N) - START) / 1000000 )) ms"
          test "$(docker inspect game --format '{{.State.ExitCode}}')" = "0"
          docker logs game | tail -5

  # тег v* -> образ у GHCR -> деплой на Render
  deploy:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: image name (GHCR хоче малі літери)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - name: deploy (Render deploy hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "секрету RENDER_DEPLOY_HOOK немає - пропускаю деплой"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "деплой запущено"
